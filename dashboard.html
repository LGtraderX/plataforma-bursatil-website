<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LGX Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #0b0b0b;
  color: white;
  text-align: center;
}

.card {
  background: #1a1a1a;
  padding: 20px;
  margin: 20px;
  border-radius: 10px;
}

.btn {
  display:inline-block;
  padding:12px 24px;
  background:#FFD700;
  color:black;
  border-radius:5px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.btn:hover {
  background:#ffcc00;
}
</style>

</head>

<body>

<h1>LGX Trading System</h1>

<p style="color:#FFD700; font-weight:bold;">
De Cero a Trader
</p>

<br>

<a href="javascript:void(0);" data-ms-action="login" class="btn">Login</a>

<!-- ================= EBOOK #1 ================= -->

<div class="card">

  <h2>Ebook #1</h2>

  <p>
  Aprende a Invertir en la Bolsa de Valores de EEUU desde Cero<br>
  Guía Inicial: Fundamentos para entender el mercado y dar tu primer paso<br>
  Volumen 1
  </p>

  <!-- SI TIENE ACCESO -->
  <div data-ms-content="ebook-1-access">
    <a href="ebook/ebook1/index.html" target="_blank" class="btn">
      Acceder ahora
    </a>
  </div>

  <!-- SI NO TIENE ACCESO -->
  <div data-ms-content="!ebook-1-access">
    <a href="javascript:void(0);" class="btn" id="buyBtn">
      Comprar Ebook #1 ($4.99)
    </a>
  </div>

</div>

<!-- MEMBERSTACK -->
<script data-memberstack-app="app_cmnckk45m000x0sydbv9bgr59" src="https://static.memberstack.com/scripts/v2/memberstack.js"></script>

<!-- CHECKOUT FIX -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const btn = document.getElementById("buyBtn");

  btn.addEventListener("click", async function () {
    try {
      await window.$memberstack.purchasePlansWithCheckout({
        priceId: "prc_ebook-1-acceso-ul100a2s"
      });
    } catch (err) {
      console.error(err);
      alert("Error abriendo checkout");
    }
  });
});
</script>

</body>
</html>
